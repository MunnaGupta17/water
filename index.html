<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1e33">
<link rel="manifest" href="manifest.json">
<title>Water</title>
<style>
/* ---------- THEME ---------- */
:root{
  --bg:#0b1e33; --card:#112b47; --text:#e8f3ff; --muted:#7fa3c7;
  --accent:#38bdf8; --accent2:#0ea5e9; --good:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#0b1e33,#081525);color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:520px;margin:auto}
h1{font-size:15px;font-weight:600;color:var(--muted);margin:20px 0 0;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:16px}
button{font:inherit;color:inherit;border:0;cursor:pointer}

/* ---------- WATER CIRCLE ---------- */
.circle{position:relative;width:240px;height:240px;margin:16px auto 0;border-radius:50%;
  overflow:hidden;background:#0d2540;border:3px solid #1d4468}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,var(--accent),var(--accent2));
  transition:height 1s cubic-bezier(.2,.8,.2,1)}
.wave{position:absolute;top:-14px;left:0;width:200%;height:16px;fill:var(--accent);animation:slide 4s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-shadow:0 2px 8px rgba(0,0,0,.4)}
.label b{font-size:44px;line-height:1}
.label span{font-size:14px;opacity:.85;margin-top:6px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
.sub .warn{color:#fbbf24}

/* ---------- BUTTONS ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.quick button{background:#17385a;padding:14px 0;border-radius:14px;font-weight:600}
.quick button:active{transform:scale(.95);background:var(--accent2)}
.row{display:flex;gap:8px;margin-top:8px}
.ghost{flex:1;background:transparent;border:1px solid #1d4468;color:var(--muted);padding:10px;border-radius:12px;font-size:13px}

/* ---------- TABS + CHART ---------- */
.tabs{display:flex;background:#0d2540;border-radius:12px;padding:4px}
.tabs button{flex:1;background:transparent;padding:8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent2);color:#fff}
.chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:3px;margin-top:18px;padding-bottom:18px}
.bar{flex:1;background:#24557e;border-radius:4px 4px 0 0;position:relative;min-height:2px;transition:height .5s}
.bar.hit{background:var(--accent)}
.bar i{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--muted)}
.goal{position:absolute;left:0;right:0;border-top:1px dashed #4b7ba8;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.stats div{background:#0d2540;border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--muted)}

/* ---------- LOG LIST ---------- */
.log{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a3a5c;font-size:14px}
.log:last-child{border:0}
.log button{background:none;color:#f87171;font-size:18px;padding:0 6px}
input[type=number]{width:100%;background:#0d2540;border:1px solid #1d4468;color:var(--text);padding:10px;border-radius:10px;font:inherit}
</style>
</head>
<body>

<h1><span id="date"></span><span id="streak"></span></h1>

<!-- Today's water circle -->
<div class="circle">
  <div class="fill" id="fill">
    <svg class="wave" viewBox="0 0 1200 20" preserveAspectRatio="none">
      <path d="M0 10 Q75 0 150 10 T300 10 T450 10 T600 10 T750 10 T900 10 T1050 10 T1200 10 V20 H0Z"/>
    </svg>
  </div>
  <div class="label"><b id="ml">0</b><span id="goalTxt"></span></div>
</div>
<div class="sub" id="since"></div>

<div class="quick">
  <button data-ml="150">+150</button>
  <button data-ml="250">+250</button>
  <button data-ml="500">+500</button>
  <button id="custom">Custom</button>
</div>
<div class="row">
  <button class="ghost" id="undo">↶ Undo last</button>
  <button class="ghost" id="settingsBtn">⚙ Settings</button>
</div>

<!-- Settings (hidden until opened) -->
<div class="card" id="settings" hidden>
  <label style="font-size:13px;color:var(--muted)">Daily goal (ml)</label>
  <input type="number" id="goalInput" min="500" step="100" style="margin:6px 0 12px">
  <div class="row" style="margin:0">
    <button class="ghost" id="export">⬇ Backup</button>
    <button class="ghost" id="import">⬆ Restore</button>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
</div>

<!-- History -->
<div class="card">
  <div class="tabs" id="tabs">
    <button data-r="week" class="on">Week</button>
    <button data-r="month">Month</button>
    <button data-r="year">Year</button>
  </div>
  <div class="chart" id="chart"></div>
  <div class="stats" id="stats"></div>
</div>

<!-- Today's entries -->
<div class="card">
  <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Today's log</div>
  <div id="log"></div>
</div>

<script>
/* =====================================================================
   DATA MODEL  (stored in localStorage under KEY as JSON)
   {
     goal: 2500,
     days: { "2026-11-25": [ {t: <epoch ms>, ml: 250}, ... ], ... }
   }
   Dates use the LOCAL calendar day (not UTC) so midnight rolls over correctly.
   ===================================================================== */
const KEY = 'water.v1';
const DEFAULT = { goal: 2500, days: {} };

function load() {
  try { return Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem(KEY))); }
  catch { return structuredClone(DEFAULT); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
let db = load();

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const totalOf = key => (db.days[key] || []).reduce((s, e) => s + e.ml, 0);
const todayKey = () => keyOf(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };

/* ---------- actions ---------- */
function add(ml) {
  const k = todayKey();
  (db.days[k] = db.days[k] || []).push({ t: Date.now(), ml });
  save(); render();
  if (navigator.vibrate) navigator.vibrate(30);
}
function undo() {
  const list = db.days[todayKey()];
  if (list && list.length) { list.pop(); save(); render(); }
}
function removeEntry(i) { db.days[todayKey()].splice(i, 1); save(); render(); }

/* Streak = consecutive days meeting goal. If today isn't met yet, we
   start counting from yesterday so the streak doesn't show 0 all morning. */
function streak() {
  let n = 0, i = totalOf(todayKey()) >= db.goal ? 0 : 1;
  for (; ; i++) { if (totalOf(keyOf(daysAgo(i))) >= db.goal) n++; else break; }
  return n;
}

/* ---------- history data per range -> [{label, value, hit}] ---------- */
function series(range) {
  const out = [], now = new Date();
  if (range === 'week') {
    for (let i = 6; i >= 0; i--) {
      const d = daysAgo(i);
      out.push({ label: 'SMTWTFS'[d.getDay()], value: totalOf(keyOf(d)) });
    }
  } else if (range === 'month') {
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    for (let day = 1; day <= last; day++) {
      const d = new Date(now.getFullYear(), now.getMonth(), day);
      out.push({ label: day % 5 === 0 || day === 1 ? day : '', value: totalOf(keyOf(d)) });
    }
  } else { // year: average per logged day, per month
    for (let m = 0; m < 12; m++) {
      let sum = 0, cnt = 0;
      const last = new Date(now.getFullYear(), m + 1, 0).getDate();
      for (let day = 1; day <= last; day++) {
        const t = totalOf(keyOf(new Date(now.getFullYear(), m, day)));
        if (t > 0) { sum += t; cnt++; }
      }
      out.push({ label: 'JFMAMJJASOND'[m], value: cnt ? Math.round(sum / cnt) : 0 });
    }
  }
  return out.map(p => ({ ...p, hit: p.value >= db.goal }));
}

/* ---------- render ---------- */
let range = 'week';
function render() {
  const total = totalOf(todayKey());
  const pct = Math.min(100, total / db.goal * 100);
  $('date').textContent = new Date().toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
  const s = streak();
  $('streak').textContent = s ? `🔥 ${s} day${s > 1 ? 's' : ''}` : '';
  $('ml').textContent = total;
  $('goalTxt').textContent = `of ${db.goal} ml · ${Math.round(pct)}%`;
  $('fill').style.height = pct + '%';

  // chart
  const data = series(range);
  const max = Math.max(db.goal, ...data.map(d => d.value)) * 1.05;
  $('chart').innerHTML =
    `<div class="goal" style="bottom:${18 + (db.goal / max) * 132}px"></div>` +
    data.map(d => `<div class="bar ${d.hit ? 'hit' : ''}" style="height:${d.value / max * 132}px"><i>${d.label}</i></div>`).join('');

  // stats (ignore empty days so averages aren't dragged down)
  const logged = data.filter(d => d.value > 0);
  const avg = logged.length ? Math.round(logged.reduce((a, d) => a + d.value, 0) / logged.length) : 0;
  const best = Math.max(0, ...data.map(d => d.value));
  const hits = data.filter(d => d.hit).length;
  $('stats').innerHTML =
    `<div><b>${avg}</b><span>avg ml</span></div><div><b>${best}</b><span>best</span></div>` +
    `<div><b>${hits}</b><span>goals hit</span></div>`;

  // today's log
  const list = db.days[todayKey()] || [];
  $('log').innerHTML = list.length ? list.map((e, i) =>
    `<div class="log"><span>${new Date(e.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
     <span>${e.ml} ml</span><button onclick="removeEntry(${i})">×</button></div>`).reverse().join('')
    : '<div class="sub">Nothing yet — have a glass 💧</div>';

  renderSince();
}

/* "Last drink 2h 10m ago" nudge — refreshed every minute */
function renderSince() {
  const list = db.days[todayKey()] || [];
  if (!list.length) { $('since').innerHTML = '<span class="warn">No water yet today</span>'; return; }
  const mins = Math.floor((Date.now() - list[list.length - 1].t) / 60000);
  const txt = mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${mins % 60}m`;
  $('since').innerHTML = mins >= 90 ? `<span class="warn">Last drink ${txt} ago — time for water!</span>` : `Last drink ${txt} ago`;
}
setInterval(renderSince, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* ---------- events ---------- */
document.querySelectorAll('.quick [data-ml]').forEach(b => b.onclick = () => add(+b.dataset.ml));
$('custom').onclick = () => { const v = parseInt(prompt('How many ml?', '300'), 10); if (v > 0 && v < 5000) add(v); };
$('undo').onclick = undo;
$('tabs').onclick = e => {
  if (!e.target.dataset.r) return;
  range = e.target.dataset.r;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target));
  render();
};
$('settingsBtn').onclick = () => { $('settings').hidden = !$('settings').hidden; $('goalInput').value = db.goal; };
$('goalInput').onchange = e => { const v = parseInt(e.target.value, 10); if (v >= 500) { db.goal = v; save(); render(); } };

/* Backup: download whole DB as JSON. Restore: replace DB from a file. */
$('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = `water-backup-${todayKey()}.json`; a.click();
};
$('import').onclick = () => $('file').click();
$('file').onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!data.days) throw 0;
    db = Object.assign({}, DEFAULT, data); save(); render(); alert('Restored ✔');
  } catch { alert('Invalid backup file'); }
};

/* ---------- boot ---------- */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); // ask browser not to evict our data
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
